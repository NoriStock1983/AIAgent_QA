# Redis設定ファイル

# ===== 基本設定 =====
# ポート設定（デフォルト）
port 6379

# バインドアドレス（すべてのインターフェースで受信）
bind 0.0.0.0

# ===== セキュリティ設定 =====
# パスワード認証を有効化
requirepass your_secure_password

# 保護モードを有効化
protected-mode yes

# ===== メモリ管理 =====
# 最大メモリ使用量（256MB）
maxmemory 256mb

# メモリ不足時の削除ポリシー（LRU: 最近最も使われていないキーを削除）
maxmemory-policy allkeys-lru

# ===== データ永続化 =====
# AOF（Append Only File）を有効化
appendonly yes

# AOFの同期頻度（毎秒）
appendfsync everysec

# RDBスナップショットの設定
# save 900 1    # 900秒間に1回以上の変更があった場合
# save 300 10   # 300秒間に10回以上の変更があった場合
# save 60 10000 # 60秒間に10000回以上の変更があった場合

# ===== ログ設定 =====
# ログレベル
loglevel notice

# ログファイル（標準出力に出力）
logfile ""

# ===== ネットワーク設定 =====
# TCP keepalive
tcp-keepalive 300

# クライアントタイムアウト（0=無制限）
timeout 0

# ===== パフォーマンス設定 =====
# データベース数
databases 16

# クライアント接続数の上限
maxclients 10000